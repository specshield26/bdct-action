name: 'SpecShield BDCT'
description: 'Bi-Directional Contract Testing for OpenAPI in CI/CD — publish specs, verify compatibility, and gate deployments.'
author: 'SpecShield Software Private Limited'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  command:
    description: |
      BDCT subcommand to run. One of:
        publish-provider | publish-consumer | verify | can-i-deploy |
        matrix | list-providers | list-consumers
    required: true

  api-token:
    description: 'SpecShield API key. Pass via a repo secret (e.g. secrets.SPECSHIELD_API_KEY).'
    required: true

  org:
    description: 'Organization key. Required by every BDCT subcommand.'
    required: true

  # ── command-specific inputs (optional at the action level; CLI validates) ──

  provider:
    description: 'Provider service name. Required by publish-provider, publish-consumer, verify, list-* (as filter).'
    required: false
  consumer:
    description: 'Consumer service name. Required by publish-consumer, verify, list-consumers (as filter).'
    required: false
  service:
    description: 'Service name for can-i-deploy (consumer or provider).'
    required: false

  version:
    description: 'Version tag. Used by publish-provider, publish-consumer, can-i-deploy.'
    required: false
  consumer-version:
    description: 'Consumer version. Required by verify.'
    required: false
  provider-version:
    description: 'Provider version. Required by verify.'
    required: false

  spec:
    description: 'Path to provider OpenAPI spec file. Required by publish-provider.'
    required: false
  contract:
    description: 'Path to consumer contract file (OpenAPI YAML/JSON or Pact JSON). Required by publish-consumer.'
    required: false
  format:
    description: 'Consumer contract format: OPENAPI | PACT. Default OPENAPI.'
    required: false
  branch:
    description: 'Optional Git branch tag stored alongside a provider spec.'
    required: false
  env:
    description: 'Environment label (e.g. staging, production). Default applies per command.'
    required: false

  # ── runtime knobs ──

  # ── governance-gate inputs ──

  min-score:
    description: 'governance-gate: minimum compliance score (0–100) required to pass. Default 70.'
    required: false
  fail-on-warning:
    description: 'governance-gate: fail when any warning-severity finding is present (default false).'
    required: false
  ruleset:
    description: 'governance-gate: path to a custom portable (Spectral-format) ruleset file. Omit to use the built-in ruleset.'
    required: false

  cli-version:
    description: 'specshield CLI version to install. Defaults to the latest 3.4.x patch (semver "~3.4.0"), so bug-fix releases roll out automatically while staying on the 3.4 minor. Override with an exact version (e.g. "3.4.0") to pin, or "latest" for the newest published.'
    required: false
    default: '~3.4.0'
  server:
    description: 'SpecShield server URL. Override only for self-hosted / staging.'
    required: false
    default: 'https://specshield.io'
  fail-on-error:
    description: 'Fail the action when the CLI exits non-zero (default true). Set false to inspect outputs first.'
    required: false
    default: 'true'

outputs:
  json:
    description: 'Raw CLI JSON response (always set when the CLI ran).'
    value: ${{ steps.run.outputs.json }}
  exit-code:
    description: 'CLI exit code (0 = clean / deployable, 1 = breaking / not deployable, 2 = config / runtime error).'
    value: ${{ steps.run.outputs.exit-code }}
  deployable:
    description: 'true / false — populated after `can-i-deploy`.'
    value: ${{ steps.run.outputs.deployable }}
  verification-id:
    description: 'Numeric verification id — populated after `verify`.'
    value: ${{ steps.run.outputs.verification-id }}
  status:
    description: 'COMPATIBLE / INCOMPATIBLE — populated after `verify`.'
    value: ${{ steps.run.outputs.status }}
  passed:
    description: 'true / false — populated after `governance-gate`.'
    value: ${{ steps.run.outputs.passed }}
  score:
    description: 'compliance score (0–100) — populated after `governance-gate`.'
    value: ${{ steps.run.outputs.score }}
  grade:
    description: 'A–F compliance grade — populated after `governance-gate`.'
    value: ${{ steps.run.outputs.grade }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache global npm install
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: specshield-cli-${{ inputs.cli-version }}-${{ runner.os }}

    - name: Install SpecShield CLI
      shell: bash
      run: |
        echo "::group::Installing specshield@${{ inputs.cli-version }}"
        npm install -g "specshield@${{ inputs.cli-version }}"
        specshield --version
        echo "::endgroup::"

    - name: Run SpecShield BDCT command
      id: run
      shell: bash
      env:
        SPECSHIELD_API_KEY: ${{ inputs.api-token }}
        SS_COMMAND: ${{ inputs.command }}
        SS_ORG: ${{ inputs.org }}
        SS_PROVIDER: ${{ inputs.provider }}
        SS_CONSUMER: ${{ inputs.consumer }}
        SS_SERVICE: ${{ inputs.service }}
        SS_VERSION: ${{ inputs.version }}
        SS_CONSUMER_VERSION: ${{ inputs.consumer-version }}
        SS_PROVIDER_VERSION: ${{ inputs.provider-version }}
        SS_SPEC: ${{ inputs.spec }}
        SS_CONTRACT: ${{ inputs.contract }}
        SS_FORMAT: ${{ inputs.format }}
        SS_BRANCH: ${{ inputs.branch }}
        SS_ENV: ${{ inputs.env }}
        SS_SERVER: ${{ inputs.server }}
        SS_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        SS_MIN_SCORE: ${{ inputs.min-score }}
        SS_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        SS_RULESET: ${{ inputs.ruleset }}
      run: |
        set -uo pipefail

        VALID="publish-provider publish-consumer verify can-i-deploy matrix list-providers list-consumers governance-gate"
        case " $VALID " in
          *" $SS_COMMAND "*) ;;
          *)
            echo "::error::Invalid command '$SS_COMMAND'. Must be one of: $VALID"
            exit 2
            ;;
        esac

        # ── Required inputs ────────────────────────────────────────────────
        # GitHub does NOT enforce `required: true` for composite actions — it is
        # documentation only. An unset repo variable or secret silently expands to
        # an empty string, so without this the CLI is invoked as `--org ""` and
        # fails with a bare "exited with code 2" that names nothing. The most
        # common cause by far is SPECSHIELD_ORG never being added as a repository
        # *Variable* (it is not a Secret).
        if [ -z "${SS_ORG:-}" ]; then
          echo "::error::'org' is empty. Set the SPECSHIELD_ORG repository variable (Settings → Secrets and variables → Actions → Variables), or pass org: directly. Find your org key in the SpecShield dashboard under Team → Organization key."
          exit 2
        fi

        if [ -z "${SPECSHIELD_API_KEY:-}" ]; then
          echo "::error::'api-token' is empty. Add SPECSHIELD_API_KEY as a repository Secret (Settings → Secrets and variables → Actions → Secrets) and pass it to the api-token input."
          exit 2
        fi

        # ── governance-gate: call the governance deploy gate directly (no CLI dep) ──
        # Fails the job when the gate verdict is `passed=false`, so a PR can be blocked
        # on API-governance policy. Spec is read from the `spec` input (a file path).
        if [ "$SS_COMMAND" = "governance-gate" ]; then
          if [ -z "$SS_SPEC" ] || [ ! -f "$SS_SPEC" ]; then
            echo "::error::governance-gate requires 'spec' to point to an OpenAPI file (got '$SS_SPEC')"
            exit 2
          fi
          BASE="${SS_SERVER%/}"

          # Build the JSON request with jq so spec/ruleset content is safely encoded
          # (never interpolated into a shell string).
          POLICY=$(jq -n \
            --arg ms "$SS_MIN_SCORE" --arg fw "$SS_FAIL_ON_WARNING" \
            '{}
             | (if $ms != "" then .minScore = ($ms|tonumber) else . end)
             | (if $fw != "" then .failOnWarning = ($fw == "true") else . end)')

          REQ=$(jq -n \
            --rawfile spec "$SS_SPEC" \
            --argjson policy "$POLICY" \
            --arg org "$SS_ORG" \
            --arg ruleset "${SS_RULESET:-}" \
            '{spec: $spec, policy: $policy}
             | (if $org != "" then .orgKey = $org else . end)
             | (if $ruleset != "" then .ruleset = ($ruleset) else . end)')
          if [ -n "${SS_RULESET:-}" ]; then
            [ -f "$SS_RULESET" ] || { echo "::error::ruleset file not found: $SS_RULESET"; exit 2; }
            REQ=$(jq -n --rawfile spec "$SS_SPEC" --rawfile rs "$SS_RULESET" \
              --argjson policy "$POLICY" --arg org "$SS_ORG" \
              '{spec: $spec, ruleset: $rs, policy: $policy}
               | (if $org != "" then .orgKey = $org else . end)')
          fi

          TMP_REQ=$(mktemp); printf '%s' "$REQ" >"$TMP_REQ"
          TMP_OUT=$(mktemp)
          HTTP=$(curl -s -o "$TMP_OUT" -w '%{http_code}' --max-time 60 \
            -X POST "$BASE/api/governance/gate" \
            -H "X-Api-Key: $SPECSHIELD_API_KEY" -H "Content-Type: application/json" \
            --data-binary "@$TMP_REQ")
          OUT="$(cat "$TMP_OUT")"; rm -f "$TMP_OUT" "$TMP_REQ"

          echo "::group::governance-gate ($HTTP)"; echo "$OUT"; echo "::endgroup::"

          if [ "$HTTP" != "200" ]; then
            MSG=$(echo "$OUT" | jq -r '.message // .error // .' 2>/dev/null || echo "$OUT")
            echo "::error::governance-gate request failed (HTTP $HTTP): $MSG"
            # 402 (plan) / 403 (org) / 400 (bad spec) are config errors → exit 2
            exit 2
          fi

          PASSED=$(echo "$OUT" | jq -r '.passed')
          SCORE=$(echo "$OUT"  | jq -r '.review.score.value // empty')
          GRADE=$(echo "$OUT"  | jq -r '.review.score.grade // empty')
          WAIVED=$(echo "$OUT" | jq -r '.waivedCount // 0')

          {
            DELIM="EOF_$(date +%s%N)"
            echo "json<<$DELIM"; echo "$OUT"; echo "$DELIM"
            echo "passed=$PASSED"
            [ -n "$SCORE" ] && echo "score=$SCORE"
            [ -n "$GRADE" ] && echo "grade=$GRADE"
            echo "exit-code=$([ "$PASSED" = "true" ] && echo 0 || echo 1)"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### SpecShield: governance gate"
            echo ""
            if [ "$PASSED" = "true" ]; then
              echo "✅ **Passed** — score **${SCORE:-?}** (grade **${GRADE:-?}**)${WAIVED:+, $WAIVED waived}"
            else
              echo "❌ **Blocked** — score **${SCORE:-?}** (grade **${GRADE:-?}**)"
              echo ""
              echo "**Reasons:**"
              echo "$OUT" | jq -r '.reasons[]? | "- " + .' 2>/dev/null || true
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "$PASSED" != "true" ]; then
            echo "::error::Governance gate failed. $(echo "$OUT" | jq -r '.recommendedAction // empty')"
            [ "$SS_FAIL_ON_ERROR" = "true" ] && exit 1
          fi
          exit 0
        fi

        ARGS=(bdct "$SS_COMMAND" --json --org "$SS_ORG" --server "$SS_SERVER")

        # Conditionally append every optional flag the user passed.
        [ -n "$SS_PROVIDER" ]         && ARGS+=(--provider         "$SS_PROVIDER")
        [ -n "$SS_CONSUMER" ]         && ARGS+=(--consumer         "$SS_CONSUMER")
        [ -n "$SS_SERVICE" ]          && ARGS+=(--service          "$SS_SERVICE")
        [ -n "$SS_VERSION" ]          && ARGS+=(--version          "$SS_VERSION")
        [ -n "$SS_CONSUMER_VERSION" ] && ARGS+=(--consumer-version "$SS_CONSUMER_VERSION")
        [ -n "$SS_PROVIDER_VERSION" ] && ARGS+=(--provider-version "$SS_PROVIDER_VERSION")
        [ -n "$SS_SPEC" ]             && ARGS+=(--spec             "$SS_SPEC")
        [ -n "$SS_CONTRACT" ]         && ARGS+=(--contract         "$SS_CONTRACT")
        [ -n "$SS_FORMAT" ]           && ARGS+=(--format           "$SS_FORMAT")
        [ -n "$SS_BRANCH" ]           && ARGS+=(--branch           "$SS_BRANCH")
        [ -n "$SS_ENV" ]              && ARGS+=(--env              "$SS_ENV")

        echo "::group::specshield ${ARGS[*]}"
        # Capture stdout (the JSON) separately from stderr (CLI's progress / errors).
        TMP_OUT=$(mktemp)
        set +e
        specshield "${ARGS[@]}" >"$TMP_OUT"
        EXIT_CODE=$?
        set -e
        OUT="$(cat "$TMP_OUT")"
        rm -f "$TMP_OUT"
        echo "exit=$EXIT_CODE"
        echo "$OUT"
        echo "::endgroup::"

        # Always emit the raw JSON + exit code as outputs.
        {
          DELIM="EOF_$(date +%s%N)"
          echo "json<<$DELIM"
          echo "$OUT"
          echo "$DELIM"
          echo "exit-code=$EXIT_CODE"
        } >>"$GITHUB_OUTPUT"

        # Typed outputs for the two commands users branch on.
        if command -v jq >/dev/null 2>&1 && [ -n "$OUT" ] && echo "$OUT" | jq empty >/dev/null 2>&1; then
          case "$SS_COMMAND" in
            can-i-deploy)
              DEPLOYABLE=$(echo "$OUT" | jq -r '.deployable // empty')
              [ -n "$DEPLOYABLE" ] && echo "deployable=$DEPLOYABLE" >>"$GITHUB_OUTPUT"
              ;;
            verify)
              VID=$(echo "$OUT" | jq -r '.id // empty')
              STATUS=$(echo "$OUT" | jq -r '.status // empty')
              [ -n "$VID" ]    && echo "verification-id=$VID" >>"$GITHUB_OUTPUT"
              [ -n "$STATUS" ] && echo "status=$STATUS"        >>"$GITHUB_OUTPUT"
              ;;
          esac
        fi

        # Step summary — surfaces the result on the GitHub Actions run page.
        {
          echo "### SpecShield: \`$SS_COMMAND\`"
          echo ""
          case "$SS_COMMAND" in
            can-i-deploy)
              if [ "$EXIT_CODE" = "0" ]; then
                echo "✅ **Deployable** — \`$SS_SERVICE@$SS_VERSION\`${SS_ENV:+ in $SS_ENV}"
              else
                echo "❌ **Not deployable** — \`$SS_SERVICE@$SS_VERSION\`${SS_ENV:+ in $SS_ENV}"
                REASON=$(echo "$OUT" | jq -r '.reason // empty' 2>/dev/null || true)
                [ -n "$REASON" ] && echo "" && echo "**Reason:** $REASON"
              fi
              ;;
            verify)
              if [ "$EXIT_CODE" = "0" ]; then
                echo "✅ **COMPATIBLE** — \`$SS_CONSUMER@$SS_CONSUMER_VERSION\` → \`$SS_PROVIDER@$SS_PROVIDER_VERSION\`"
              else
                echo "❌ **INCOMPATIBLE** — \`$SS_CONSUMER@$SS_CONSUMER_VERSION\` → \`$SS_PROVIDER@$SS_PROVIDER_VERSION\`"
              fi
              ;;
            publish-provider|publish-consumer)
              [ "$EXIT_CODE" = "0" ] && echo "✅ Published" || echo "❌ Publish failed"
              ;;
            *)
              echo "Exit code: \`$EXIT_CODE\`"
              ;;
          esac
        } >>"$GITHUB_STEP_SUMMARY"

        if [ "$SS_FAIL_ON_ERROR" = "true" ] && [ "$EXIT_CODE" -ne 0 ]; then
          echo "::error::SpecShield CLI exited with code $EXIT_CODE"
          exit "$EXIT_CODE"
        fi

        exit 0
